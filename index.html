<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0645c0">

<title>InspiringPG PFP Maker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #f1f5fb;
    font-family: Arial, Helvetica, sans-serif;
    color: #12336b;
    display: flex;
    justify-content: center;
    padding: 25px 12px;
}

.container {
    width: 100%;
    max-width: 650px;
    text-align: center;
}

h1 {
    margin: 5px 0 8px;
    font-size: 30px;
    color: #073b82;
}

.subtitle {
    margin: 0 0 20px;
    color: #58708f;
    font-size: 16px;
}

/* PREVIEW */

.preview-box {
    background: white;
    border-radius: 25px;
    padding: 22px;
    box-shadow: 0 10px 35px rgba(0,0,0,.10);
}

.canvas-wrap {
    width: min(90vw, 560px);
    height: min(90vw, 560px);
    margin: auto;
    position: relative;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

/* BUTTONS */

button,
.upload-label {
    width: 100%;
    border: none;
    border-radius: 17px;
    padding: 18px;
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    display: block;
}

.upload-label {
    background: #0757c9;
    color: white;
}

.download {
    background: #fbc21b;
    color: #073b82;
}

.reset {
    background: #e9eef7;
    color: #12336b;
}

input {
    display: none;
}

.status {
    min-height: 25px;
    margin-top: 12px;
    color: #d13a3a;
    font-size: 14px;
}

/* MOBILE */

@media(max-width:500px) {

    body {
        padding: 15px 8px;
    }

    .preview-box {
        padding: 14px;
        border-radius: 20px;
    }

    h1 {
        font-size: 25px;
    }

    .subtitle {
        font-size: 14px;
    }

    button,
    .upload-label {
        font-size: 16px;
        padding: 16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>InspiringPG PFP Maker</h1>

    <p class="subtitle">
        Choose your photo — the branded frame is added automatically.
    </p>

    <div class="preview-box">

        <div class="canvas-wrap">
            <canvas id="pfpCanvas"></canvas>
        </div>

        <label class="upload-label" for="photoInput">
            📷 Choose Profile Photo
        </label>

        <input
            id="photoInput"
            type="file"
            accept="image/jpeg,image/png,image/webp,image/heic,image/heif"
        >

        <button class="download" id="downloadBtn">
            ⬇️ Download My PFP
        </button>

        <button class="reset" id="resetBtn">
            Reset
        </button>

        <div class="status" id="status"></div>

    </div>

</div>


<script>

const canvas = document.getElementById("pfpCanvas");
const ctx = canvas.getContext("2d");

const input = document.getElementById("photoInput");
const downloadBtn = document.getElementById("downloadBtn");
const resetBtn = document.getElementById("resetBtn");
const status = document.getElementById("status");

const SIZE = 1200;

canvas.width = SIZE;
canvas.height = SIZE;

let uploadedImage = null;


/* =========================
   DRAW PFP
========================= */

function drawPFP() {

    ctx.clearRect(0, 0, SIZE, SIZE);

    /*
       BACKGROUND
    */

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, SIZE, SIZE);


    /*
       PROFILE PHOTO
       Perfect circular crop
    */

    ctx.save();

    ctx.beginPath();
    ctx.arc(600, 600, 430, 0, Math.PI * 2);
    ctx.clip();

    if (uploadedImage) {

        const img = uploadedImage;

        const ratio = Math.max(
            860 / img.width,
            860 / img.height
        );

        const width = img.width * ratio;
        const height = img.height * ratio;

        const x = 600 - width / 2;
        const y = 600 - height / 2;

        ctx.drawImage(
            img,
            x,
            y,
            width,
            height
        );

    } else {

        ctx.fillStyle = "#e9eef7";
        ctx.fillRect(150,150,900,900);

    }

    ctx.restore();


    /*
       MAIN BLUE BORDER
    */

    ctx.beginPath();
    ctx.arc(600,600,475,0,Math.PI*2);

    ctx.strokeStyle = "#0756c9";
    ctx.lineWidth = 55;
    ctx.stroke();


    /*
       GOLD INNER BORDER
    */

    ctx.beginPath();
    ctx.arc(600,600,442,0,Math.PI*2);

    ctx.strokeStyle = "#fbc21b";
    ctx.lineWidth = 18;
    ctx.stroke();


    /*
       WHITE HIGHLIGHT
    */

    ctx.beginPath();
    ctx.arc(600,600,488,0,Math.PI*2);

    ctx.strokeStyle = "rgba(255,255,255,.95)";
    ctx.lineWidth = 7;
    ctx.stroke();


    /*
       BLUE OUTER LINE
    */

    ctx.beginPath();
    ctx.arc(600,600,505,0,Math.PI*2);

    ctx.strokeStyle = "#003b91";
    ctx.lineWidth = 8;
    ctx.stroke();


    /*
       TOP BRANDING PANEL
    */

    ctx.save();

    ctx.fillStyle = "white";

    roundRect(
        ctx,
        335,
        65,
        530,
        145,
        30
    );

    ctx.fill();


    /*
       INSPIRINGPG ICON
    */

    ctx.fillStyle = "#8dc63f";

    ctx.beginPath();
    ctx.moveTo(390,95);
    ctx.lineTo(425,75);
    ctx.lineTo(425,175);
    ctx.lineTo(390,195);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#159fe3";

    ctx.beginPath();
    ctx.moveTo(435,75);
    ctx.lineTo(475,98);
    ctx.lineTo(475,175);
    ctx.lineTo(435,195);
    ctx.closePath();
    ctx.fill();


    /*
       INSPIRINGPG TEXT
    */

    ctx.fillStyle = "#28328c";

    ctx.font = "bold 52px Arial";
    ctx.textAlign = "left";

    ctx.fillText(
        "InspiringPG",
        500,
        140
    );

    ctx.fillStyle = "#666";

    ctx.font = "24px Arial";

    ctx.fillText(
        "Inspiring Passion and Grit",
        502,
        175
    );

    ctx.restore();


    /*
       BOTTOM G FIBER PANEL
    */

    ctx.save();

    ctx.fillStyle = "white";

    roundRect(
        ctx,
        320,
        975,
        560,
        150,
        32
    );

    ctx.fill();

    ctx.strokeStyle = "#0b3f91";
    ctx.lineWidth = 8;

    roundRect(
        ctx,
        320,
        975,
        560,
        150,
        32
    );

    ctx.stroke();


    /*
       G FIBER LOGO
    */

    ctx.fillStyle = "#fbc21b";

    ctx.font = "bold 78px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
        "G",
        430,
        1065
    );


    ctx.fillStyle = "#163e91";

    ctx.font = "bold 48px Arial";

    ctx.fillText(
        "FIBER",
        600,
        1045
    );

    ctx.fillStyle = "#fbc21b";

    ctx.font = "bold 34px Arial";

    ctx.fillText(
        "PLAN",
        600,
        1085
    );


    /*
       WIFI SYMBOL
    */

    ctx.strokeStyle = "#163e91";
    ctx.lineWidth = 8;

    ctx.beginPath();
    ctx.arc(
        720,
        1030,
        25,
        Math.PI * 1.2,
        Math.PI * 1.8
    );
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(
        720,
        1030,
        15,
        Math.PI * 1.2,
        Math.PI * 1.8
    );
    ctx.stroke();

    ctx.restore();


    /*
       DECORATIVE SIDE ELEMENTS
    */

    drawSideAccent(150, 600, false);
    drawSideAccent(1050, 600, true);


    /*
       SPARKLES
    */

    sparkle(190,280);
    sparkle(1010,850);

}


/* =========================
   HELPERS
========================= */

function roundRect(ctx,x,y,w,h,r){

    ctx.beginPath();

    ctx.moveTo(x+r,y);

    ctx.lineTo(x+w-r,y);

    ctx.quadraticCurveTo(
        x+w,y,
        x+w,y+r
    );

    ctx.lineTo(x+w,y+h-r);

    ctx.quadraticCurveTo(
        x+w,y+h,
        x+w-r,y+h
    );

    ctx.lineTo(x+r,y+h);

    ctx.quadraticCurveTo(
        x,y+h,
        x,y+h-r
    );

    ctx.lineTo(x,y+r);

    ctx.quadraticCurveTo(
        x,y,
        x+r,y
    );

    ctx.closePath();
}


function drawSideAccent(x,y,right){

    ctx.save();

    ctx.fillStyle = "#fbc21b";

    ctx.beginPath();

    if(!right){

        ctx.moveTo(x,y-60);
        ctx.lineTo(x+35,y-30);
        ctx.lineTo(x+35,y+30);
        ctx.lineTo(x,y+60);

    }else{

        ctx.moveTo(x,y-60);
        ctx.lineTo(x-35,y-30);
        ctx.lineTo(x-35,y+30);
        ctx.lineTo(x,y+60);

    }

    ctx.closePath();

    ctx.fill();

    ctx.restore();
}


function sparkle(x,y){

    ctx.save();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 8;

    ctx.beginPath();

    ctx.moveTo(x-25,y);
    ctx.lineTo(x+25,y);

    ctx.moveTo(x,y-25);
    ctx.lineTo(x,y+25);

    ctx.stroke();

    ctx.restore();
}


/* =========================
   PHOTO UPLOAD
========================= */

input.addEventListener("change", function(e){

    const file = e.target.files[0];

    if(!file) return;

    status.textContent = "";

    /*
       IMPORTANT:
       FileReader is used instead of createImageBitmap.

       This makes the uploader much more compatible
       with iPhone Safari and Android browsers.
    */

    const reader = new FileReader();

    reader.onload = function(event){

        const img = new Image();

        img.onload = function(){

            uploadedImage = img;

            drawPFP();

            status.textContent = "";

        };

        img.onerror = function(){

            status.textContent =
                "Could not read that photo. Please try a JPG or PNG.";

        };

        img.src = event.target.result;

    };

    reader.onerror = function(){

        status.textContent =
            "Could not read that photo. Please try again.";

    };

    reader.readAsDataURL(file);

});


/* =========================
   DOWNLOAD
========================= */

downloadBtn.addEventListener("click", function(){

    if(!uploadedImage){

        status.textContent =
            "Please choose your profile photo first.";

        return;

    }

    canvas.toBlob(function(blob){

        if(!blob){

            status.textContent =
                "Could not create the image.";

            return;

        }

        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");

        a.href = url;
        a.download = "InspiringPG-PFP.png";

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

        setTimeout(function(){

            URL.revokeObjectURL(url);

        },1000);

    }, "image/png");

});


/* =========================
   RESET
========================= */

resetBtn.addEventListener("click", function(){

    uploadedImage = null;

    input.value = "";

    status.textContent = "";

    drawPFP();

});


/* INITIAL */

drawPFP();

</script>

</body>
</html>
