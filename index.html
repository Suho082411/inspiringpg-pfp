<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b3d91"
    >

    <meta
        name="description"
        content="Create your official InspiringPG profile picture."
    >

    <title>InspiringPG PFP Maker</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef5ff 0%,
                    #ffffff 45%,
                    #e5efff 100%
                );

            color: #123b78;

            padding:
                25px
                15px
                40px;
        }


        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .container {

            width: 100%;

            max-width: 760px;

            margin: auto;

            background: #ffffff;

            border-radius: 30px;

            padding: 30px;

            box-shadow:
                0 20px 60px
                rgba(0, 50, 120, 0.15);
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {

            text-align: center;

            margin-bottom: 25px;
        }


        .header h1 {

            margin: 0;

            font-size: 32px;

            font-weight: 800;

            color: #103b78;
        }


        .header h1 span {

            color: #145dcc;
        }


        .subtitle {

            margin-top: 10px;

            color: #687991;

            font-size: 16px;

            line-height: 1.5;
        }


        /* =========================================
           PREVIEW AREA
        ========================================= */

        .preview-wrapper {

            width: 100%;

            max-width: 650px;

            margin: 0 auto;

            padding: 10px;
        }


        .preview {

            position: relative;

            width: 100%;

            aspect-ratio: 1 / 1;

            overflow: hidden;

            border-radius: 50%;

            background: #e9eef6;

            box-shadow:
                0 10px 30px
                rgba(0, 45, 100, 0.15);
        }


        /* =========================================
           PHOTO
        ========================================= */

        #photo {

            position: absolute;

            width: 65%;

            height: 65%;

            left: 17.5%;

            top: 17.5%;

            object-fit: cover;

            border-radius: 50%;

            display: none;

            z-index: 2;
        }


        /* =========================================
           PLACEHOLDER
        ========================================= */

        .placeholder {

            position: absolute;

            width: 65%;

            height: 65%;

            left: 17.5%;

            top: 17.5%;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #f3f6fa,
                    #e1e8f2
                );

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            color: #7b899b;

            font-size: 18px;

            line-height: 1.5;

            z-index: 1;

            border:
                2px solid
                rgba(20, 90, 190, 0.08);
        }


        /* =========================================
           FRAME
        ========================================= */

        .frame {

            position: absolute;

            width: 100%;

            height: 100%;

            left: 0;

            top: 0;

            object-fit: contain;

            z-index: 3;

            pointer-events: none;

            user-select: none;
        }


        /* =========================================
           BUTTONS
        ========================================= */

        .buttons {

            margin-top: 25px;
        }


        .upload-label,
        .download-button {

            width: 100%;

            min-height: 58px;

            border-radius: 17px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            font-size: 18px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;

            user-select: none;
        }


        /* BLUE BUTTON */

        .upload-label {

            background:
                linear-gradient(
                    135deg,
                    #0d58c9,
                    #1747a5
                );

            color: white;

            box-shadow:
                0 8px 20px
                rgba(13, 88, 201, 0.25);
        }


        .upload-label:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 25px
                rgba(13, 88, 201, 0.3);
        }


        .upload-label:active {

            transform: scale(0.98);
        }


        /* YELLOW BUTTON */

        .download-button {

            margin-top: 13px;

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #ffc400,
                    #ffae00
                );

            color: #123b78;

            box-shadow:
                0 8px 20px
                rgba(255, 183, 0, 0.25);
        }


        .download-button:hover {

            transform: translateY(-2px);

            filter: brightness(1.04);

            box-shadow:
                0 12px 25px
                rgba(255, 183, 0, 0.3);
        }


        .download-button:active {

            transform: scale(0.98);
        }


        input[type="file"] {

            display: none;
        }


        /* =========================================
           STATUS MESSAGE
        ========================================= */

        .status {

            text-align: center;

            margin-top: 15px;

            min-height: 22px;

            font-size: 14px;

            color: #718096;
        }


        .status.success {

            color: #178348;

            font-weight: 600;
        }


        .status.error {

            color: #d62828;

            font-weight: 600;
        }


        /* =========================================
           FOOTER
        ========================================= */

        .footer {

            text-align: center;

            margin-top: 25px;

            color: #8996a8;

            font-size: 13px;

            line-height: 1.5;
        }


        .footer strong {

            color: #174b9a;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            body {

                padding:
                    12px
                    10px
                    25px;
            }


            .container {

                padding: 18px;

                border-radius: 24px;
            }


            .header h1 {

                font-size: 25px;
            }


            .subtitle {

                font-size: 14px;

                margin-top: 8px;
            }


            .preview-wrapper {

                padding: 4px;
            }


            .upload-label,
            .download-button {

                min-height: 55px;

                font-size: 16px;

                border-radius: 15px;
            }


            .placeholder {

                font-size: 14px;
            }
        }


        /* =========================================
           VERY SMALL PHONES
        ========================================= */

        @media (max-width: 380px) {

            .container {

                padding: 14px;
            }


            .header h1 {

                font-size: 22px;
            }


            .subtitle {

                font-size: 13px;
            }
        }

    </style>

</head>


<body>


    <main class="container">


        <!-- =====================================
             HEADER
        ====================================== -->

        <header class="header">

            <h1>
                InspiringPG
                <span>PFP Maker</span>
            </h1>

            <div class="subtitle">

                Choose your photo —
                your official InspiringPG frame
                is added automatically.

            </div>

        </header>


        <!-- =====================================
             PREVIEW
        ====================================== -->

        <div class="preview-wrapper">

            <div
                class="preview"
                id="preview"
            >


                <!-- PLACEHOLDER -->

                <div
                    class="placeholder"
                    id="placeholder"
                >

                    📸<br>

                    Your profile photo
                    <br>

                    will appear here

                </div>


                <!-- USER PHOTO -->

                <img
                    id="photo"
                    alt="Selected Profile Photo"
                >


                <!-- BRAND FRAME -->

                <img
                    src="frame.png"
                    class="frame"
                    id="frame"
                    alt="InspiringPG Official Frame"
                >

            </div>

        </div>


        <!-- =====================================
             BUTTONS
        ====================================== -->

        <div class="buttons">


            <!-- PHOTO INPUT -->

            <label
                for="photoInput"
                class="upload-label"
            >

                📷 &nbsp; Choose Profile Photo

            </label>


            <input
                type="file"
                id="photoInput"
                accept="image/jpeg,image/png,image/webp,image/heic,image/heif"
            >


            <!-- DOWNLOAD -->

            <button
                type="button"
                class="download-button"
                id="downloadBtn"
            >

                ⬇️ &nbsp; Download My PFP

            </button>


            <!-- STATUS -->

            <div
                class="status"
                id="status"
            ></div>

        </div>


        <!-- =====================================
             FOOTER
        ====================================== -->

        <div class="footer">

            <strong>InspiringPG</strong><br>

            Inspiring Passion and Grit

        </div>


    </main>


    <script>

        /* =========================================
           ELEMENTS
        ========================================= */

        const photoInput =
            document.getElementById("photoInput");

        const photo =
            document.getElementById("photo");

        const placeholder =
            document.getElementById("placeholder");

        const downloadBtn =
            document.getElementById("downloadBtn");

        const status =
            document.getElementById("status");


        /* =========================================
           VARIABLES
        ========================================= */

        let selectedImage = null;


        /* =========================================
           STATUS FUNCTION
        ========================================= */

        function setStatus(message, type = "") {

            status.textContent = message;

            status.className =
                "status " + type;
        }


        /* =========================================
           PHOTO SELECTION
        ========================================= */

        photoInput.addEventListener(
            "change",
            function(event) {

                const file =
                    event.target.files[0];


                if (!file) {

                    return;
                }


                /* Check file type */

                if (
                    !file.type.startsWith("image/")
                ) {

                    setStatus(
                        "Please select an image.",
                        "error"
                    );

                    return;
                }


                /* Limit to 20 MB */

                if (
                    file.size >
                    20 * 1024 * 1024
                ) {

                    setStatus(
                        "Please choose an image smaller than 20 MB.",
                        "error"
                    );

                    return;
                }


                const reader =
                    new FileReader();


                reader.onload =
                    function(e) {

                        selectedImage =
                            e.target.result;


                        photo.src =
                            selectedImage;


                        photo.style.display =
                            "block";


                        placeholder.style.display =
                            "none";


                        setStatus(
                            "Photo ready! You can download your PFP.",
                            "success"
                        );

                    };


                reader.onerror =
                    function() {

                        setStatus(
                            "Unable to read this photo.",
                            "error"
                        );

                    };


                reader.readAsDataURL(file);

            }
        );


        /* =========================================
           IMAGE LOADER
        ========================================= */

        function loadImage(src) {

            return new Promise(
                function(resolve, reject) {

                    const img =
                        new Image();


                    img.onload =
                        function() {

                            resolve(img);

                        };


                    img.onerror =
                        function() {

                            reject(
                                new Error(
                                    "Image could not be loaded."
                                )
                            );

                        };


                    img.src = src;

                }
            );

        }


        /* =========================================
           DOWNLOAD FUNCTION
        ========================================= */

        downloadBtn.addEventListener(
            "click",
            async function() {


                /* No photo */

                if (!selectedImage) {

                    setStatus(
                        "Please choose a profile photo first.",
                        "error"
                    );

                    return;
                }


                try {

                    setStatus(
                        "Preparing your PFP..."
                    );


                    /* Load user image */

                    const userImage =
                        await loadImage(
                            selectedImage
                        );


                    /* Load frame */

                    const frameImage =
                        await loadImage(
                            "frame.png"
                        );


                    /* =================================
                       CREATE CANVAS
                    ================================= */

                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    const ctx =
                        canvas.getContext(
                            "2d"
                        );


                    canvas.width =
                        1080;


                    canvas.height =
                        1080;


                    /* =================================
                       WHITE BACKGROUND
                    ================================= */

                    ctx.fillStyle =
                        "#ffffff";


                    ctx.fillRect(
                        0,
                        0,
                        1080,
                        1080
                    );


                    /* =================================
                       PHOTO SIZE

                       This matches the opening
                       in the frame.
                    ================================= */

                    const photoSize =
                        700;


                    const photoX =
                        (1080 - photoSize) / 2;


                    const photoY =
                        (1080 - photoSize) / 2;


                    /* =================================
                       CIRCULAR PHOTO CLIPPING
                    ================================= */

                    ctx.save();


                    ctx.beginPath();


                    ctx.arc(
                        540,
                        540,
                        photoSize / 2,
                        0,
                        Math.PI * 2
                    );


                    ctx.closePath();


                    ctx.clip();


                    /* =================================
                       COVER IMAGE

                       Makes the photo fill
                       the circular area.
                    ================================= */

                    const scale =
                        Math.max(

                            photoSize /
                            userImage.width,

                            photoSize /
                            userImage.height

                        );


                    const imageWidth =
                        userImage.width *
                        scale;


                    const imageHeight =
                        userImage.height *
                        scale;


                    const imageX =
                        540 -
                        imageWidth / 2;


                    const imageY =
                        540 -
                        imageHeight / 2;


                    ctx.drawImage(

                        userImage,

                        imageX,
                        imageY,

                        imageWidth,
                        imageHeight

                    );


                    ctx.restore();


                    /* =================================
                       FRAME ON TOP
                    ================================= */

                    ctx.drawImage(

                        frameImage,

                        0,
                        0,

                        1080,
                        1080

                    );


                    /* =================================
                       CREATE DOWNLOAD
                    ================================= */

                    canvas.toBlob(
                        function(blob) {

                            if (!blob) {

                                setStatus(
                                    "Could not create the image.",
                                    "error"
                                );

                                return;
                            }


                            const url =
                                URL.createObjectURL(
                                    blob
                                );


                            const link =
                                document.createElement(
                                    "a"
                                );


                            link.href =
                                url;


                            link.download =
                                "InspiringPG-PFP.png";


                            document.body.appendChild(
                                link
                            );


                            link.click();


                            document.body.removeChild(
                                link
                            );


                            setTimeout(
                                function() {

                                    URL.revokeObjectURL(
                                        url
                                    );

                                },
                                1000
                            );


                            setStatus(
                                "Your InspiringPG PFP is ready! 🎉",
                                "success"
                            );

                        },

                        "image/png"
                    );


                }

                catch(error) {

                    console.error(error);


                    setStatus(

                        "Something went wrong. Make sure frame.png is uploaded to GitHub.",

                        "error"

                    );

                }

            }
        );

    </script>


</body>

</html>
